name: Runtime CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/runtime-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/runtime-ci.yml'

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra messaging --extra feishu --python 3.12

      - name: Run runtime-focused tests
        run: |
          scripts/run_tests.sh -j 4 \
            tests/gateway/test_platform_reconnect.py \
            tests/gateway/test_platform_reconnect_fd_leak.py \
            tests/gateway/test_feishu_ws_multiplex_isolation.py \
            tests/gateway/test_fork_feishu_accounts.py \
            tests/gateway/test_fork_feishu_progress.py \
            tests/gateway/test_feishu.py \
            tests/gateway/test_sethome_multi_account.py \
            tests/gateway/test_unauthorized_dm_behavior.py \
            tests/gateway/test_run_progress_topics.py \
            tests/gateway/test_active_session_text_merge.py \
            tests/gateway/test_config.py \
            tests/cron/test_scheduler.py \
            tests/agent/test_compression_feasibility.py \
            tests/hermes_cli/test_fast_command.py \
            tests/gateway/test_fast_command.py \
            tests/agent/test_provider_parity.py \
            tests/agent/test_run_agent_codex_responses.py \
            tests/agent/test_fork_verbosity.py \
            tests/tools/test_feishu_id_tool.py \
            tests/tools/test_send_message_tool.py \
            -q --tb=short
        env:
          # Ensure tests don't accidentally call real APIs.
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
